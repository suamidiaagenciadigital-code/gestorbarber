<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#111111"/>
  <!-- Scissors blades top-left to bottom-right -->
  <g transform="translate(256,256)">
    <!-- Ring 1 (top-left) -->
    <circle cx="-80" cy="-80" r="60" fill="none" stroke="#F7F3EC" stroke-width="28"/>
    <!-- Ring 2 (bottom-right) -->
    <circle cx="80" cy="80" r="60" fill="none" stroke="#C89B3C" stroke-width="28"/>
    <!-- Cross blades -->
    <line x1="-38" y1="-38" x2="38" y2="38" stroke="#F7F3EC" stroke-width="24" stroke-linecap="round"/>
    <line x1="-38" y1="38" x2="38" y2="-38" stroke="#C89B3C" stroke-width="24" stroke-linecap="round"/>
    <!-- Extended handles -->
    <line x1="38" y1="-38" x2="130" y2="-130" stroke="#F7F3EC" stroke-width="24" stroke-linecap="round"/>
    <line x1="38" y1="38" x2="130" y2="130" stroke="#C89B3C" stroke-width="24" stroke-linecap="round"/>
  </g>
</svg>
